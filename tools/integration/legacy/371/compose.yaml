name: kafka-gitops-371-lab

# Apache 3.7.1 KRaft lab. Separate volumes/network; host access is loopback only.
services:
  kafka-1:
    image: apache/kafka:3.7.1
    pull_policy: never
    hostname: kafka-1
    restart: "no"
    ports: ["127.0.0.1:23792:9092"]
    environment:
      CLUSTER_ID: "GV57l31pRMa-yIjZQBWyww"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:19092,HOST://127.0.0.1:23792"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_BROKER_RACK: "rack-1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes: ["kafka-1-data:/var/lib/kafka/data"]
    networks: [legacy-host]
  kafka-2:
    image: apache/kafka:3.7.1
    pull_policy: never
    hostname: kafka-2
    restart: "no"
    ports: ["127.0.0.1:23793:9092"]
    environment:
      CLUSTER_ID: "GV57l31pRMa-yIjZQBWyww"
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:19092,HOST://127.0.0.1:23793"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_BROKER_RACK: "rack-2"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes: ["kafka-2-data:/var/lib/kafka/data"]
    networks: [legacy-host]
  kafka-3:
    image: apache/kafka:3.7.1
    pull_policy: never
    hostname: kafka-3
    restart: "no"
    ports: ["127.0.0.1:23794:9092"]
    environment:
      CLUSTER_ID: "GV57l31pRMa-yIjZQBWyww"
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:19092,HOST://127.0.0.1:23794"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_BROKER_RACK: "rack-3"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes: ["kafka-3-data:/var/lib/kafka/data"]
    networks: [legacy-host]
networks:
  legacy-host:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
