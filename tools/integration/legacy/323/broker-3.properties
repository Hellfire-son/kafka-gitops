broker.id=3
broker.rack=rack-3
listeners=INTERNAL://:19092,HOST://:9092
advertised.listeners=INTERNAL://kafka-3:19092,HOST://127.0.0.1:23294
listener.security.protocol.map=INTERNAL:PLAINTEXT,HOST:PLAINTEXT
inter.broker.listener.name=INTERNAL
log.dirs=/var/lib/kafka/data
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000
auto.create.topics.enable=false
num.partitions=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
min.insync.replicas=1
group.initial.rebalance.delay.ms=0
inter.broker.protocol.version=3.2-IV0
log.message.format.version=3.2-IV0
