# Modified for the independent 0.4.0 fork: safe build/test only, no publishing.
name: Java CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile, run safe unit tests and verify release packaging
        run: ./gradlew --no-daemon --no-scan --console=plain clean classes testClasses test shadowJar verifyReleaseArtifact buildExecutableJar buildRelease
      - name: Run offline integration-runner guards
        run: python3 -B -m unittest discover -s tools/integration -p 'test_*.py'
      - name: Run offline release and CLI checks
        run: python3 -B tools/release/verify_release.py
